<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0d6b7c">
<title>مصاريفي الشهرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-column phone app — sticky header with month switcher, stacked cards, fixed tab bar with a central add button */
  --bg:#eef2f1;--surface:#ffffff;--surface-2:#f4f7f6;--ink:#13201d;--muted:#5d6d69;--line:#dbe3e1;
  --accent:#0d6b7c;--accent-ink:#ffffff;--accent-soft:#d5e9ed;
  --good:#23824a;--warn:#a26a06;--bad:#c0392b;
  --good-soft:#dbefe2;--warn-soft:#f6e9cc;--bad-soft:#f7dcd8;
  --display:"Readex Pro","IBM Plex Sans Arabic",-apple-system,system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",-apple-system,system-ui,sans-serif;
  --r:18px;--shadow:0 1px 2px rgba(10,40,40,.06),0 8px 24px rgba(10,40,40,.05);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1214;--surface:#152024;--surface-2:#1b282c;--ink:#e5eef0;--muted:#94a6aa;--line:#25363b;
    --accent:#47b3c8;--accent-ink:#04252c;--accent-soft:#15363e;
    --good:#4cc27a;--warn:#e2aa3c;--bad:#f06c5c;--good-soft:#16362a;--warn-soft:#3a2f14;--bad-soft:#3e1e1a;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1214;--surface:#152024;--surface-2:#1b282c;--ink:#e5eef0;--muted:#94a6aa;--line:#25363b;
  --accent:#47b3c8;--accent-ink:#04252c;--accent-soft:#15363e;
  --good:#4cc27a;--warn:#e2aa3c;--bad:#f06c5c;--good-soft:#16362a;--warn-soft:#3a2f14;--bad-soft:#3e1e1a;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--sat) + 10px) 16px 10px;border-bottom:1px solid transparent}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.sync{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--good)}.sync.saving i{background:var(--warn)}.sync.error i{background:var(--bad)}
.monthbar{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:10px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.monthbar button{border:0;background:transparent;width:40px;height:36px;border-radius:10px;display:grid;place-items:center}
.monthbar button:active{background:var(--surface-2)}
.monthbar .mname{font-family:var(--display);font-weight:600;border:0;background:none;padding:4px 10px;border-radius:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthbar svg{width:20px;height:20px;stroke:var(--ink)}

main{max-width:560px;margin:0 auto;padding:12px 16px calc(110px + var(--sab));display:flex;flex-direction:column;gap:14px}
.view{display:none;flex-direction:column;gap:14px}.view.on{display:flex}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0;text-wrap:balance}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .eyebrow{font-size:14px;opacity:.85}
.hero .big{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.15;margin:6px 0 14px;font-variant-numeric:tabular-nums;word-break:break-word}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-row div{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:12px;padding:8px 12px}
.hero-row span{display:block;font-size:12px;opacity:.85}
.hero-row b{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

/* budget */
.budget{display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:116px;height:116px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;font-size:22px}
.ring .rl small{display:block;font-size:11px;font-weight:400;color:var(--muted);font-family:var(--body)}
.stat-list{display:flex;flex-direction:column;gap:8px}
.stat-list div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.stat-list b{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.note{margin-top:12px;font-size:13px;border-radius:12px;padding:8px 12px;background:var(--surface-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.bad{background:var(--bad-soft);color:var(--bad)}.note.good{background:var(--good-soft);color:var(--good)}

/* category bars */
.cbars{display:flex;flex-direction:column;gap:12px}
.cbar-top{display:flex;align-items:center;gap:10px;font-size:14px}
.cbar-top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar-top b{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--surface-2);flex:none}
.ico.s{width:30px;height:30px;font-size:15px;border-radius:10px}

/* transactions */
.txs{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:right;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .main{flex:1;min-width:0}
.tx .t1,.tx .t2{display:block}
.tx .t1{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.tx .amt.inc{color:var(--good)}
.badge{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 5px;margin-inline-start:4px}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:14px 2px 4px;font-weight:600}
.dayhead .num{font-weight:500}

/* filters */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.exp{color:var(--bad)}.seg button.on.inc{color:var(--good)}

/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;display:block;word-break:break-word}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--bad)}.down{color:var(--good)}

.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-family:var(--body);fill:var(--muted);font-size:10px}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.cmp td.n{font-family:var(--display);white-space:nowrap}

/* settings */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:right;font-size:15px}
.row:last-child{border-bottom:0}
.row .r-val{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px}
.row select,.row input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:15px;max-width:55%}
.row.danger{color:var(--bad)}
.chev{width:16px;height:16px;stroke:var(--muted);flex:none}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 10px calc(6px + var(--sab))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{justify-self:center;width:60px!important;height:60px;border-radius:20px!important;background:var(--accent)!important;color:var(--accent-ink)!important;transform:translateY(-14px);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent);display:grid!important;place-items:center}
.fab svg{width:28px!important;height:28px!important;stroke-width:2.4!important}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,15,15,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:60;background:var(--bg);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 16px calc(20px + var(--sab))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--display);font-size:19px;margin:0;font-weight:600}
.shead{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.amount-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.amount-box input{width:100%;border:0;background:none;text-align:center;font-family:var(--display);font-weight:700;font-size:40px;font-variant-numeric:tabular-nums;direction:ltr;outline:none;padding:0}
.amount-box .prev{font-size:13px;color:var(--muted);min-height:20px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catgrid button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;line-height:1.25;min-height:76px}
.catgrid button span:first-child{font-size:22px}
.catgrid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:16px;width:100%;min-height:48px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.btn{border:0;border-radius:14px;padding:14px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px}
.mini.del{color:var(--bad)}
.editrow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.editrow input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-size:16px;width:100%}
.editrow input.emo{text-align:center;font-size:20px;padding:6px}
.budrow{display:grid;grid-template-columns:auto 1fr 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.budrow input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-size:16px;width:100%;direction:ltr;text-align:left}

.empty{text-align:center;padding:28px 12px}
.empty .e{font-size:40px}
.empty p{color:var(--muted);margin:6px 0 16px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner button{border:0;background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;flex:none}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}

.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(100px + var(--sab));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:370px){.hero .big{font-size:32px}.catgrid{grid-template-columns:repeat(3,1fr)}.donut-wrap{grid-template-columns:120px 1fr}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">مصاريفي</div>
    <button class="sync" id="sync" data-act="syncInfo" type="button"><i></i><span>على هذا الجهاز</span></button>
  </div>
  <div class="monthbar" id="monthbar">
    <button type="button" data-act="prevM" aria-label="الشهر السابق"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button type="button" class="mname" id="mname" data-act="thisM">—</button>
    <button type="button" data-act="nextM" aria-label="الشهر التالي"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
</header>

<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-list"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-settings"></section>
</main>

<nav class="tabs">
  <div class="in">
    <button type="button" data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
    <button type="button" data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>العمليات</button>
    <button type="button" class="fab" data-act="add" aria-label="إضافة عملية"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>الإحصائيات</button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
  </div>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
/* ---------- constants ---------- */
const KEY='masareef.v1';
const MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const MSHORT=['ك٢','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','ت١','ت٢','ك١'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const CURRENCIES={
  IQD:{name:'دينار عراقي',sym:'د.ع',dec:0,chips:[250,1000,5000,10000,25000,50000]},
  USD:{name:'دولار أمريكي',sym:'$',dec:2,chips:[1,5,10,20,50,100]},
  EUR:{name:'يورو',sym:'€',dec:2,chips:[1,5,10,20,50,100]},
  SAR:{name:'ريال سعودي',sym:'ر.س',dec:2,chips:[5,10,50,100,200,500]},
  AED:{name:'درهم إماراتي',sym:'د.إ',dec:2,chips:[5,10,50,100,200,500]},
  TRY:{name:'ليرة تركية',sym:'₺',dec:2,chips:[10,50,100,200,500,1000]}
};
const PAL=['#0d6b7c','#d98e1f','#c9506b','#6b8f2a','#4a5bb5','#b5603a','#2f9fc4','#8a4f9e'];
const PAL_OTHER='#8a9a97';
function defaultCats(){return [
  {id:'food',name:'سوق وأكل',icon:'🛒',type:'exp'},
  {id:'rest',name:'مطاعم وكافيهات',icon:'🍔',type:'exp'},
  {id:'fuel',name:'بنزين ومواصلات',icon:'⛽',type:'exp'},
  {id:'gen',name:'مولدة وكهرباء',icon:'⚡',type:'exp'},
  {id:'net',name:'إنترنت ورصيد',icon:'📶',type:'exp'},
  {id:'rent',name:'إيجار',icon:'🏠',type:'exp'},
  {id:'bills',name:'ماء وفواتير',icon:'🧾',type:'exp'},
  {id:'health',name:'صحة ودواء',icon:'💊',type:'exp'},
  {id:'clothes',name:'ملابس',icon:'👕',type:'exp'},
  {id:'edu',name:'دراسة وكتب',icon:'📚',type:'exp'},
  {id:'fun',name:'طلعات وترفيه',icon:'🎉',type:'exp'},
  {id:'gift',name:'مناسبات وهدايا',icon:'🎁',type:'exp'},
  {id:'kids',name:'أطفال',icon:'🧸',type:'exp'},
  {id:'car',name:'سيارة وتصليح',icon:'🔧',type:'exp'},
  {id:'other',name:'أخرى',icon:'📦',type:'exp'},
  {id:'salary',name:'راتب',icon:'💼',type:'inc'},
  {id:'free',name:'شغل إضافي',icon:'💻',type:'inc'},
  {id:'ginc',name:'هدية وعيدية',icon:'🎁',type:'inc'},
  {id:'oinc',name:'دخل آخر',icon:'➕',type:'inc'}
];}
function defaultSettings(){return {currency:'IQD',digits:'en',theme:'auto',budget:0,catBudgets:{},cats:defaultCats(),recurring:[],recSkip:{},pays:['نقد','بطاقة','محفظة إلكترونية'],demo:false};}

/* ---------- state ---------- */
let S={settings:defaultSettings(),months:{}};
let cur='';
let tab='home';
const F={q:'',type:'all',cat:''};
const dirty=new Set();
let col=null,flushing=false,flushTimer=null,syncState='local';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
function mkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
const thisMonth=()=>mkey(new Date());
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function shiftMonth(k,n){let [y,m]=k.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)}
function daysIn(k){const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const CUR=()=>CURRENCIES[S.settings.currency]||CURRENCIES.IQD;
const LOC=()=>S.settings.digits==='ar'?'ar-IQ':'en-US';
function num(n,dec){return new Intl.NumberFormat(LOC(),{maximumFractionDigits:dec??CUR().dec}).format(n)}
function plain(n){return new Intl.NumberFormat(LOC(),{useGrouping:false}).format(n)}
function money(n){return num(Math.round(n*100)/100)+' '+CUR().sym}
function short(n){const a=Math.abs(n);if(a>=1e6)return num(n/1e6,1)+' مليون';if(a>=1e3)return num(n/1e3,a>=1e4?0:1)+' ألف';return num(n,0)}
function monthName(k){const [y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+plain(y)}
function dayLabel(ds){const [y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);const t=todayStr();
  if(ds===t)return 'اليوم';const yd=new Date();yd.setDate(yd.getDate()-1);if(ds===yd.getFullYear()+'-'+pad(yd.getMonth()+1)+'-'+pad(yd.getDate()))return 'أمس';
  return DAYS[dt.getDay()]+' '+plain(d)+' '+MONTHS[m-1]}
function parseAmount(s){s=String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/[,،٬\s]/g,'');const v=parseFloat(s);return isFinite(v)&&v>0?v:0}
function cat(id){return S.settings.cats.find(c=>c.id===id)||{id,name:'فئة محذوفة',icon:'❔',type:'exp'}}
function txs(k){return S.months[k]||[]}
function sums(k){let exp=0,inc=0;const byCat={};for(const t of txs(k)){if(t.type==='inc')inc+=t.amount;else{exp+=t.amount;byCat[t.cat]=(byCat[t.cat]||0)+t.amount}}return{exp,inc,byCat,count:txs(k).length}}
function hasAny(){return Object.values(S.months).some(a=>a.length)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- persistence ---------- */
function fromRaw(v){return {settings:Object.assign(defaultSettings(),v.settings||{}),months:v.months||{},savedAt:v.savedAt||0}}
function loadLocal(){try{const raw=localStorage.getItem(KEY);if(raw)S=fromRaw(JSON.parse(raw))}catch(e){}}
const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('masareef',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
  get(k){return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
  set(k,v){return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}};
let snaps=[];
async function initDevice(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(!(await IDB.open()))return;
  const raw=await IDB.get('state');
  if(raw){try{const v=fromRaw(JSON.parse(raw));if(v.savedAt>(S.savedAt||0)){S=v;applyTheme();applyAllRecurring();render()}}catch(e){}}
  snaps=(await IDB.get('snaps'))||[];
  // automatic internal copy once a month (keeps the last 3)
  if(hasAny()&&!snaps.some(x=>x.month===thisMonth())){snaps.unshift({month:thisMonth(),at:Date.now(),data:JSON.stringify(S)});snaps=snaps.slice(0,3);await IDB.set('snaps',snaps)}
  saveLocal();
}
function saveLocal(){S.savedAt=Date.now();const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}if(IDB.db)IDB.set('state',j)}
function commit(keys){(keys||[]).forEach(k=>dirty.add(k));saveLocal();scheduleCloud();render()}
function setSync(st){syncState=st;const el=$('#sync');el.className='sync '+st;
  el.querySelector('span').textContent={local:'محفوظ على الجهاز',cloud:'محفوظ بالسحابة',saving:'يحفظ…',error:'ما انحفظ، اضغط'}[st]}
function scheduleCloud(){if(!col)return;clearTimeout(flushTimer);flushTimer=setTimeout(flush,700)}
async function writeDoc(k){const id=k==='settings'?'settings':'m-'+k;const body=k==='settings'?S.settings:(S.months[k]||[]);
  await col.doc(id).set({json:JSON.stringify(body),updated:Date.now()})}
async function flush(){if(!col||flushing)return;flushing=true;setSync('saving');
  try{while(dirty.size){const k=dirty.values().next().value;dirty.delete(k);
      try{await writeDoc(k)}catch(e){if(e&&e.code==='unavailable'){await sleep(700+Math.random()*800);try{await writeDoc(k)}catch(e2){dirty.add(k);throw e2}}else{dirty.add(k);throw e}}}
    setSync('cloud')}
  catch(e){setSync('error');if(e&&e.code==='quota_exceeded')toast('مساحة الحفظ امتلأت، صدّر نسخة واحذف أشهر قديمة')}
  finally{flushing=false;if(dirty.size&&syncState!=='error')scheduleCloud()}}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return}
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync('local');return}
    const id=await user.id();if(!id){setSync('local');return}
    const c=db.collection('data/users/'+id);
    const snap=await c.get();
    if(snap.empty){
      col=c;
      if(hasAny()||S.settings.budget){dirty.add('settings');Object.keys(S.months).forEach(k=>dirty.add(k));await flush()}else setSync('cloud');
      return;
    }
    const next={settings:defaultSettings(),months:{}};
    snap.docs.forEach(d=>{const b=d.data()||{};try{const v=JSON.parse(b.json);
      if(d.id==='settings')next.settings=Object.assign(defaultSettings(),v);else if(d.id.startsWith('m-'))next.months[d.id.slice(2)]=v}catch(e){}});
    // keep local edits made before sync finished, and months only on this device
    for(const k of dirty){if(k==='settings')next.settings=S.settings;else next.months[k]=S.months[k]||[]}
    for(const k in S.months){if(!(k in next.months)&&S.months[k].length){next.months[k]=S.months[k];dirty.add(k)}}
    S=next;col=c;applyTheme();saveLocal();
    if(applyAllRecurring())saveLocal();
    render();
    if(dirty.size)await flush();else setSync('cloud');
  }catch(e){col=null;setSync('local')}
}

/* ---------- recurring ---------- */
function applyRecurring(k){
  if(k>thisMonth())return false;let changed=false;
  for(const r of S.settings.recurring){
    if(r.start>k||S.settings.recSkip[r.id+'|'+k])continue;
    const list=txs(k);if(list.some(t=>t.rec===r.id))continue;
    const day=Math.min(r.day,daysIn(k));
    if(k===thisMonth()&&day>new Date().getDate())continue;
    (S.months[k]||(S.months[k]=[])).push({id:uid(),type:r.type||'exp',amount:r.amount,cat:r.cat,note:r.note||'',pay:r.pay||S.settings.pays[0],date:k+'-'+pad(day),rec:r.id});
    dirty.add(k);changed=true;
  }
  return changed;
}
function applyAllRecurring(){let changed=false;const now=thisMonth();
  for(const r of S.settings.recurring){let k=r.start,guard=0;while(k<=now&&guard++<36){if(applyRecurring(k))changed=true;k=shiftMonth(k,1)}}
  return changed}
function upcoming(){if(cur!==thisMonth())return[];const d=new Date().getDate();
  return S.settings.recurring.filter(r=>r.start<=cur&&!S.settings.recSkip[r.id+'|'+cur]&&!txs(cur).some(t=>t.rec===r.id)&&Math.min(r.day,daysIn(cur))>d).sort((a,b)=>a.day-b.day)}

/* ---------- theme ---------- */
function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ---------- render ---------- */
function render(){
  $('#mname').textContent=monthName(cur)+(cur===thisMonth()?'':' ↺');
  $('#monthbar').style.display=tab==='settings'?'none':'flex';
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+tab));
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ({home:renderHome,list:renderList,stats:renderStats,settings:renderSettings})[tab]();
}

function txRow(t){const c=cat(t.cat);const inc=t.type==='inc';
  const sub=[t.note,t.pay,tab==='home'?dayLabel(t.date):''].filter(Boolean).map(esc).join(' · ');
  return `<button class="tx" type="button" data-act="edit" data-id="${t.id}" data-m="${t.date.slice(0,7)}">
    <span class="ico">${esc(c.icon)}</span>
    <span class="main"><span class="t1">${esc(c.name)}${t.rec?'<span class="badge">ثابت</span>':''}</span><span class="t2">${sub||'&nbsp;'}</span></span>
    <span class="amt num ${inc?'inc':''}">${inc?'+':'−'}${money(t.amount)}</span></button>`}

function ring(pct,color){const C=2*Math.PI*50;const p=Math.min(pct,1);
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`}

function renderHome(){
  const st=S.settings,s=sums(cur),B=st.budget,isNow=cur===thisMonth(),dim=daysIn(cur);
  const day=isNow?new Date().getDate():(cur<thisMonth()?dim:0);
  let h='';
  const standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(!standalone&&!st.installDismissed)h+=`<div class="banner" style="background:var(--accent-soft);color:var(--accent)"><span>ثبّته على الشاشة الرئيسية حتى يشتغل بدون نت وتبقى بياناتك محفوظة.</span><button type="button" data-act="install">شلون؟</button></div>`;
  if(hasAny()&&!st.demo&&(!st.lastBackup||mkey(new Date(st.lastBackup))!==thisMonth()))h+=`<div class="banner"><span>💾 صار وقت النسخة الاحتياطية لهذا الشهر${st.lastBackup?'':' (ما سوّيت ولا نسخة لحد الآن)'}.</span><button type="button" data-act="backup">سوّيها هسه</button></div>`;
  if(st.demo)h+=`<div class="banner"><span>هذه بيانات تجريبية حتى تشوف شكل البرنامج.</span><button type="button" data-act="clearDemo">امسحها وابدأ</button></div>`;
  if(!hasAny()){
    h+=`<div class="card empty"><div class="e">👋</div><h2>هلا بيك! خلّينا نبدي</h2><p>سجّل أول مصروف، أو جرّب البرنامج ببيانات تجريبية تنمسح بضغطة.</p>
    <div class="btns"><button class="btn" type="button" data-act="add">أضف مصروف</button><button class="btn ghost" type="button" data-act="demo">بيانات تجريبية</button></div></div>`;
  }
  let pill='';
  if(B>0){const u=s.exp/B;pill=u>=1?'<span class="pill bad">تجاوزت الميزانية</span>':u>=.8?'<span class="pill warn">قريب من الحد</span>':'<span class="pill good">ضمن الميزانية</span>'}
  h+=`<section class="card hero"><div class="hero-top"><span class="eyebrow">مصاريف ${esc(monthName(cur))}</span>${pill}</div>
    <div class="big">${money(s.exp)}</div>
    <div class="hero-row"><div><span>الدخل</span><b>${money(s.inc)}</b></div><div><span>الصافي (الدخل − المصاريف)</span><b>${s.inc-s.exp<0?'−':''}${money(Math.abs(s.inc-s.exp))}</b></div></div></section>`;

  if(B>0){
    const used=s.exp/B,left=B-s.exp,daysLeft=isNow?dim-day+1:0;
    const col=used>=1?'var(--bad)':used>=.8?'var(--warn)':'var(--good)';
    let note='';
    if(isNow){
      const expected=B*day/dim;
      if(left<=0)note=`<div class="note bad">تجاوزت الميزانية بـ ${money(-left)}. حاول توقف المصاريف غير الضرورية لآخر الشهر.</div>`;
      else if(s.exp>expected*1.1)note=`<div class="note warn">صرفك أسرع من المعدل: المفروض تكون صارف حوالي ${money(expected)} لحد اليوم.</div>`;
      else note=`<div class="note good">ماشي زين. تگدر تصرف حوالي <b class="num">${money(left/daysLeft)}</b> باليوم لآخر الشهر.</div>`;
    }
    h+=`<section class="card"><div class="chead"><h2>الميزانية الشهرية</h2><button class="link" type="button" data-act="budget">تعديل</button></div>
      <div class="budget"><div class="ring">${ring(used,col)}<div class="rl"><div>${plain(Math.round(used*100))}%<small>مستخدم</small></div></div></div>
      <div class="stat-list"><div><span class="muted">الميزانية</span><b>${money(B)}</b></div><div><span class="muted">صرفت</span><b>${money(s.exp)}</b></div>
      <div><span class="muted">${left>=0?'باقي':'زيادة'}</span><b style="color:${left>=0?'var(--good)':'var(--bad)'}">${money(Math.abs(left))}</b></div>
      ${isNow?`<div><span class="muted">أيام متبقية</span><b>${plain(daysLeft)}</b></div>`:''}</div></div>${note}</section>`;
  }else{
    h+=`<section class="card"><div class="chead"><h2>حدد ميزانية شهرية</h2></div><p class="muted small" style="margin:0 0 12px">البرنامج راح يحسبلك شگد تگدر تصرف باليوم وينبهك إذا قربت من الحد.</p>
      <button class="btn ghost" type="button" data-act="budget">تحديد الميزانية</button></section>`;
  }

  const up=upcoming();
  if(up.length){h+=`<section class="card"><div class="chead"><h2>مصاريف ثابتة قادمة</h2><span class="pill neutral">${plain(up.length)}</span></div><div class="txs">`+
    up.map(r=>{const c=cat(r.cat);return `<div class="tx"><span class="ico">${esc(c.icon)}</span><span class="main"><span class="t1">${esc(r.note||c.name)}</span><span class="t2">يوم ${plain(r.day)} من الشهر</span></span><span class="amt num">${money(r.amount)}</span></div>`}).join('')+`</div></section>`}

  // category budget alerts
  const alerts=Object.entries(st.catBudgets).filter(([id,b])=>b>0&&(s.byCat[id]||0)>=b*.8).map(([id,b])=>{const v=s.byCat[id]||0,c=cat(id);const over=v>=b;
    return `<div class="note ${over?'bad':'warn'}" style="margin:0">${esc(c.icon)} ${esc(c.name)}: ${over?'تجاوزت':'وصلت'} ${plain(Math.round(v/b*100))}% من ميزانيتها (${money(v)} من ${money(b)})</div>`});
  if(alerts.length)h+=`<section class="card"><div class="chead"><h2>تنبيهات الفئات</h2></div><div style="display:flex;flex-direction:column;gap:8px">${alerts.join('')}</div></section>`;

  const top=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]);
  if(top.length){
    const colors=colorMap(top);
    h+=`<section class="card"><div class="chead"><h2>وين راحت فلوسك</h2><button class="link" type="button" data-tab="stats">التفاصيل</button></div><div class="cbars">`+
    top.slice(0,5).map(([id,v])=>{const c=cat(id),b=st.catBudgets[id],pct=s.exp?v/s.exp:0;const w=b?Math.min(v/b,1):pct;
      const fill=b&&v>=b?'var(--bad)':colors[id];
      return `<div><div class="cbar-top"><span class="ico s">${esc(c.icon)}</span><span class="nm">${esc(c.name)}</span><span class="muted small num">${plain(Math.round(pct*100))}%</span><b>${money(v)}</b></div>
      <div class="track"><i style="width:${(w*100).toFixed(1)}%;background:${fill}"></i></div>${b?`<div class="small muted" style="margin-top:3px">من ميزانية ${money(b)}</div>`:''}</div>`}).join('')+`</div></section>`;
  }

  const recent=[...txs(cur)].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6);
  if(recent.length)h+=`<section class="card"><div class="chead"><h2>آخر العمليات</h2><button class="link" type="button" data-tab="list">عرض الكل</button></div><div class="txs">${recent.map(txRow).join('')}</div></section>`;
  $('#v-home').innerHTML=h;
}

function colorMap(sorted){const m={};sorted.forEach(([id],i)=>m[id]=i<PAL.length-1?PAL[i]:PAL_OTHER);return m}

function renderList(){
  const all=txs(cur);
  const usedCats=[...new Set(all.map(t=>t.cat))];
  const q=F.q.trim().toLowerCase();
  let list=all.filter(t=>(F.type==='all'||t.type===F.type)&&(!F.cat||t.cat===F.cat)&&(!q||(cat(t.cat).name+' '+(t.note||'')+' '+(t.pay||'')+' '+t.amount).toLowerCase().includes(q)));
  list.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  let tot=0;list.forEach(t=>tot+=t.type==='inc'?t.amount:-t.amount);
  let h=`<input class="search" id="q" type="search" placeholder="ابحث بالملاحظة أو الفئة أو المبلغ" value="${esc(F.q)}" autocomplete="off">

  if(usedCats.length>1)h+=`<div class="chips"><button type="button" class="chip ${!F.cat?'on':''}" data-f-cat="">كل الفئات</button>${usedCats.map(id=>{const c=cat(id);return `<button type="button" class="chip ${F.cat===id?'on':''}" data-f-cat="${esc(id)}">${esc(c.icon)} ${esc(c.name)}</button>`}).join('')}</div>`;
  if(!list.length){h+=`<div class="card empty"><div class="e">🧾</div><p>${all.length?'ماكو نتائج بهذا البحث.':'ماكو عمليات بهذا الشهر.'}</p>${all.length?'':'<button class="btn" type="button" data-act="add">أضف عملية</button>'}</div>`}

    let lastDay='';

    h+='</div></section>';
  }
  const el=$('#v-list');const hadFocus=document.activeElement&&document.activeElement.id==='q';
  el.innerHTML=h;

}

function renderStats(){
  const s=sums(cur),prevK=shiftMonth(cur,-1),p=sums(prevK),dim=daysIn(cur),isNow=cur===thisMonth();
  const daysCount=isNow?new Date().getDate():(cur<thisMonth()?dim:0);
  const exps=txs(cur).filter(t=>t.type!=='inc');
  const biggest=exps.reduce((m,t)=>!m||t.amount>m.amount?t:m,null);
  const ch=p.exp?(s.exp-p.exp)/p.exp:null;
  let h=`<div class="kpis">
    <div class="kpi"><span>متوسط الصرف اليومي</span><b>${daysCount?money(s.exp/daysCount):'—'}</b></div>
    <div class="kpi"><span>مقارنة بـ ${esc(MONTHS[+prevK.slice(5)-1])}</span><b class="${ch==null?'':ch>0?'up':'down'}">${ch==null?'—':(ch>0?'▲ ':'▼ ')+plain(Math.abs(Math.round(ch*100)))+'%'}</b><em class="muted">${ch==null?'ماكو بيانات':ch>0?'صرفت أكثر':'صرفت أقل'}</em></div>
    <div class="kpi"><span>أكبر مصروف</span><b>${biggest?money(biggest.amount):'—'}</b><em class="muted">${biggest?esc(cat(biggest.cat).name):''}</em></div>
    <div class="kpi"><span>نسبة الادخار</span><b class="${s.inc&&s.inc>=s.exp?'down':s.inc?'up':''}">${s.inc?plain(Math.round((s.inc-s.exp)/s.inc*100))+'%':'—'}</b><em class="muted">من الدخل</em></div>
  </div>`;
  // donut
  const sorted=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]);
  if(sorted.length){
    const colors=colorMap(sorted);
    const main=sorted.slice(0,PAL.length-1),rest=sorted.slice(PAL.length-1).reduce((a,[,v])=>a+v,0);
    const parts=main.map(([id,v])=>({name:cat(id).name,icon:cat(id).icon,v,c:colors[id]}));if(rest)parts.push({name:'باقي الفئات',icon:'',v:rest,c:PAL_OTHER});
    const C=2*Math.PI*42;let off=0;
    const arcs=parts.map(pt=>{const len=pt.v/s.exp*C;const a=`<circle cx="60" cy="60" r="42" fill="none" stroke="${pt.c}" stroke-width="16" stroke-dasharray="${Math.max(len-1.2,0.6)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return a}).join('');
    h+=`<section class="card"><div class="chead"><h2>توزيع المصاريف</h2></div><div class="donut-wrap">
      <svg class="chart" viewBox="0 0 120 120" role="img" aria-label="توزيع المصاريف حسب الفئة">${arcs}
      <text x="60" y="57" text-anchor="middle" style="font-size:9px">المجموع</text><text x="60" y="71" text-anchor="middle" style="font-size:13px;fill:var(--ink);font-family:var(--display);font-weight:600">${esc(short(s.exp))}</text></svg>
      <div class="legend">${parts.map(pt=>`<div><i style="background:${pt.c}"></i><span class="nm">${esc(pt.icon)} ${esc(pt.name)}</span><b>${plain(Math.round(pt.v/s.exp*100))}%</b></div>`).join('')}</div></div></section>`;
  }
  // daily bars
  const daily=Array(dim).fill(0);exps.forEach(t=>{daily[+t.date.slice(8)-1]+=t.amount});
  const B=S.settings.budget,perDay=B?B/dim:0;
  const max=Math.max(...daily,perDay)||1;
  const W=340,H=150,L=4,R=4,T=14,Bt=20,cw=(W-L-R)/dim,bw=Math.max(cw*.62,2);
  const y=v=>T+(H-T-Bt)*(1-v/max);
  const today=isNow?new Date().getDate():-1;
  let bars='';daily.forEach((v,i)=>{if(!v)return;const x=L+i*cw+(cw-bw)/2;const over=perDay&&v>perDay;
    bars+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-Bt-y(v)).toFixed(1)}" rx="2" fill="${over?'var(--bad)':'var(--accent)'}" opacity="${i+1===today?1:.75}"/>`});
  const grid=[0.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const xl=[1,10,20,dim].map(d=>`<text x="${L+(d-1)*cw+cw/2}" y="${H-5}" text-anchor="middle">${plain(d)}</text>`).join('');
  h+=`<section class="card"><div class="chead"><h2>الصرف اليومي</h2><span class="small muted">أعلى يوم ${money(Math.max(...daily))}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="الصرف اليومي خلال الشهر">${grid}<line x1="${L}" x2="${W-R}" y1="${H-Bt}" y2="${H-Bt}" stroke="var(--line)"/>
    ${bars}${perDay?`<line x1="${L}" x2="${W-R}" y1="${y(perDay)}" y2="${y(perDay)}" stroke="var(--warn)" stroke-dasharray="4 3" stroke-width="1.2"/><text x="${W-R}" y="${y(perDay)-4}" text-anchor="end" style="fill:var(--warn)">الحد اليومي ${esc(short(perDay))}</text>`:''}
    <text x="${L}" y="${T-3}">${esc(short(max))}</text>${xl}</svg></section>`;
  // 6 months
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(cur,-i));
  const vals=ms.map(k=>sums(k));const m6=Math.max(...vals.map(v=>Math.max(v.exp,v.inc)))||1;
  const W2=340,H2=160,gw=(W2-8)/6,b2=gw*.3;const y2=v=>14+(H2-14-22)*(1-v/m6);
  let g='';ms.forEach((k,i)=>{const x=4+i*gw+gw/2;const v=vals[i];
    g+=`<rect x="${x-b2-1}" y="${y2(v.exp)}" width="${b2}" height="${H2-22-y2(v.exp)}" rx="2" fill="var(--accent)" opacity="${k===cur?1:.6}"/>`+
       `<rect x="${x+1}" y="${y2(v.inc)}" width="${b2}" height="${H2-22-y2(v.inc)}" rx="2" fill="var(--good)" opacity="${k===cur?1:.6}"/>`+
       `<text x="${x}" y="${H2-6}" text-anchor="middle" style="${k===cur?'fill:var(--ink);font-weight:600':''}">${esc(MSHORT[+k.slice(5)-1])}</text>`});
  h+=`<section class="card"><div class="chead"><h2>آخر ٦ أشهر</h2><span class="small"><span style="color:var(--accent)">■</span> مصاريف <span style="color:var(--good)">■</span> دخل</span></div>
   <svg class="chart" viewBox="0 0 ${W2} ${H2}" role="img" aria-label="المصاريف والدخل لآخر ستة أشهر"><line x1="4" x2="${W2-4}" y1="${y2(m6)}" y2="${y2(m6)}" stroke="var(--line)"/><text x="4" y="10">${esc(short(m6))}</text><line x1="4" x2="${W2-4}" y1="${H2-22}" y2="${H2-22}" stroke="var(--line)"/>${g}</svg></section>`;
  // compare table
  const ids=[...new Set([...Object.keys(s.byCat),...Object.keys(p.byCat)])].sort((a,b)=>(s.byCat[b]||0)-(s.byCat[a]||0));
  if(ids.length){h+=`<section class="card"><div class="chead"><h2>مقارنة الفئات مع الشهر السابق</h2></div><div style="overflow-x:auto"><table class="cmp"><thead><tr><th>الفئة</th><th>هذا الشهر</th><th>السابق</th><th>الفرق</th></tr></thead><tbody>`+
    ids.map(id=>{const a=s.byCat[id]||0,b=p.byCat[id]||0,d=a-b;const c=cat(id);
      return `<tr><td>${esc(c.icon)} ${esc(c.name)}</td><td class="n">${esc(short(a))}</td><td class="n muted">${esc(short(b))}</td><td class="n ${d>0?'up':d<0?'down':''}">${d===0?'—':(d>0?'+':'−')+esc(short(Math.abs(d)))}</td></tr>`}).join('')+`</tbody></table></div></section>`}
  $('#v-stats').innerHTML=h;
}

let sheetClose=null;
function openSheet(html,onMount,onClose){$('#sheetIn').innerHTML=html;$('#sheet').scrollTop=0;$('#backdrop').classList.add('on');$('#sheet').classList.add('on');sheetClose=onClose||null;if(onMount)onMount($('#sheetIn'))}
function closeSheet(){$('#backdrop').classList.remove('on');$('#sheet').classList.remove('on');if(document.activeElement)document.activeElement.blur();const f=sheetClose;sheetClose=null;if(f)f()}
function head(t){return `<div class="shead"><h3>${t}</h3><button class="x" type="button" data-act="close" aria-label="إغلاق">×</button></div>`}
function ask(msg,ok,danger){return new Promise(res=>{let done=false;
  openSheet(`${head('تأكيد')}<p style="margin:0">${msg}</p><div class="btns"><button class="btn ${danger?'danger':''}" type="button" id="cy">${ok}</button><button class="btn ghost" type="button" id="cn">إلغاء</button></div>`,
  el=>{el.querySelector('#cy').onclick=()=>{done=true;closeSheet();res(true)};el.querySelector('#cn').onclick=()=>closeSheet()},()=>{if(!done)res(false)})})}

function txSheet(t){
  const editing=!!t;const st=S.settings;
  const defDate=cur===thisMonth()?todayStr():cur+'-01';
  const d=t?{...t}:{type:'exp',amount:0,cat:'',note:'',pay:st.pays[0],date:defDate};
  const lastCat=k=>{const l=Object.values(S.months).flat().filter(x=>x.type===k).sort((a,b)=>b.id.localeCompare(a.id))[0];return l?l.cat:''};
  const html=`${head(editing?'تعديل العملية':'عملية جديدة')}
  <div class="seg" id="tt"><button type="button" data-t="exp">مصروف</button><button type="button" data-t="inc">دخل</button></div>
  <div class="amount-box"><input id="amt" type="text" inputmode="decimal" placeholder="0" value="${d.amount?d.amount:''}" autocomplete="off" aria-label="المبلغ"><div class="prev" id="prev"></div>
   <div class="chips" style="justify-content:center;flex-wrap:wrap;margin-top:8px" id="qchips">${CUR().chips.map(v=>`<button type="button" class="chip" data-add="${v}">+${short(v)}</button>`).join('')}</div></div>
  <div class="field"><label>الفئة</label><div class="catgrid" id="cg"></div></div>
  <div class="grid2"><div class="field"><label for="dt">التاريخ</label><input id="dt" type="date" value="${d.date}"></div>
   <div class="field"><label for="pay">طريقة الدفع</label><select id="pay">${st.pays.map(p=>`<option ${p===d.pay?'selected':''}>${esc(p)}</option>`).join('')}</select></div></div>
  <div class="field"><label for="nt">ملاحظة</label><input id="nt" type="text" placeholder="مثلاً: غدا ويا الشباب" value="${esc(d.note)}" maxlength="80"></div>
  ${editing?'':`<label class="check" for="rec"><input type="checkbox" id="rec"><span>مصروف ثابت يتكرر كل شهر بنفس اليوم</span></label>`}
  <button class="btn" type="button" id="save">${editing?'حفظ التعديل':'إضافة'}</button>
  ${editing?'<button class="btn danger" type="button" id="del">حذف العملية</button>':''}`;
  openSheet(html,el=>{
    const amt=el.querySelector('#amt'),prev=el.querySelector('#prev');
    const upd=()=>{const v=parseAmount(amt.value);prev.textContent=v?money(v):'اكتب المبلغ'};
    const drawCats=()=>{el.querySelectorAll('#tt button').forEach(b=>b.className=b.dataset.t===d.type?'on '+d.type:'');
      const cs=st.cats.filter(c=>c.type===d.type);if(!cs.some(c=>c.id===d.cat))d.cat=lastCat(d.type)&&cs.some(c=>c.id===lastCat(d.type))?lastCat(d.type):(cs[0]||{}).id;
      el.querySelector('#cg').innerHTML=cs.map(c=>`<button type="button" data-c="${esc(c.id)}" class="${c.id===d.cat?'on':''}"><span>${esc(c.icon)}</span><span>${esc(c.name)}</span></button>`).join('');
      const r=el.querySelector('.check');if(r)r.style.display=d.type==='exp'?'flex':'none'};
    el.querySelector('#tt').onclick=e=>{const b=e.target.closest('[data-t]');if(b){d.type=b.dataset.t;drawCats()}};
    el.querySelector('#cg').onclick=e=>{const b=e.target.closest('[data-c]');if(b){d.cat=b.dataset.c;el.querySelectorAll('#cg button').forEach(x=>x.classList.toggle('on',x===b))}};
    el.querySelector('#qchips').onclick=e=>{const b=e.target.closest('[data-add]');if(b){amt.value=String(parseAmount(amt.value)+Number(b.dataset.add));upd()}};
    amt.oninput=upd;upd();drawCats();
    if(!editing)setTimeout(()=>amt.focus(),320);
    el.querySelector('#save').onclick=()=>{
      const v=parseAmount(amt.value);if(!v){toast('اكتب المبلغ أول');amt.focus();return}
      const date=el.querySelector('#dt').value||defDate;
      const data={type:d.type,amount:v,cat:d.cat,note:el.querySelector('#nt').value.trim(),pay:el.querySelector('#pay').value,date};
      const keys=[];
      if(editing){const om=t.date.slice(0,7);const arr=S.months[om]||[];const i=arr.findIndex(x=>x.id===t.id);if(i>=0)arr.splice(i,1);data.id=t.id;
        if(t.rec){data.rec=t.rec;if(om!==date.slice(0,7)){st.recSkip[t.rec+'|'+om]=1;keys.push('settings')}}
        if(t.demo)data.demo=true;keys.push(om)}
      else data.id=uid();
      const nk=date.slice(0,7);
      if(!editing&&el.querySelector('#rec')&&el.querySelector('#rec').checked&&d.type==='exp'){
        const r={id:uid(),type:'exp',amount:v,cat:d.cat,note:data.note,pay:data.pay,day:+date.slice(8),start:nk};st.recurring.push(r);data.rec=r.id;keys.push('settings')}
      (S.months[nk]||(S.months[nk]=[])).push(data);keys.push(nk);
      if(nk!==cur){cur=nk}
      closeSheet();commit(keys);toast(editing?'تم الحفظ':'انضافت ✓');
    };
    const del=el.querySelector('#del');
    if(del)del.onclick=async()=>{const om=t.date.slice(0,7);const ok=await ask('تريد تحذف هذي العملية؟'+(t.rec?' (هي مصروف ثابت، راح تنحذف من هذا الشهر بس)':''),'احذف',true);if(!ok)return;
      const arr=S.months[om]||[];const i=arr.findIndex(x=>x.id===t.id);if(i>=0)arr.splice(i,1);const keys=[om];
      if(t.rec){st.recSkip[t.rec+'|'+om]=1;keys.push('settings')}commit(keys);toast('انحذفت')};
  });
}

  el=>{el.querySelector('#cbs').onclick=()=>{const nb={};el.querySelectorAll('[data-cb]').forEach(i=>{const v=parseAmount(i.value);if(v)nb[i.dataset.cb]=v});st.catBudgets=nb;closeSheet();commit(['settings']);toast('تم الحفظ')}})}

function catsSheet(){const st=S.settings;
  const draw=el=>{el.querySelector('#cl').innerHTML=['exp','inc'].map(tp=>`<div class="small muted" style="margin:10px 0 2px;font-weight:600">${tp==='exp'?'فئات المصاريف':'فئات الدخل'}</div>`+st.cats.filter(c=>c.type===tp).map(c=>`<div class="editrow"><input class="emo" data-ce="${esc(c.id)}" value="${esc(c.icon)}" aria-label="رمز الفئة"><input data-cn="${esc(c.id)}" value="${esc(c.name)}" aria-label="اسم الفئة"><button class="mini del" type="button" data-cd="${esc(c.id)}">حذف</button></div>`).join('')).join('')};
  openSheet(`${head('إدارة الفئات')}<div id="cl"></div>
   <div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>فئة جديدة</h2><div class="editrow" style="border:0;padding:0;grid-template-columns:52px 1fr"><input class="emo" id="ne" value="🏷️" aria-label="رمز"><input id="nn" placeholder="اسم الفئة" aria-label="اسم الفئة الجديدة"></div>
   <div class="seg" id="ntp"><button type="button" class="on exp" data-t="exp">مصروف</button><button type="button" data-t="inc">دخل</button></div><button class="btn ghost" type="button" id="na">إضافة الفئة</button></div>
   <button class="btn" type="button" id="cs">تم</button>`,el=>{let tp='exp';draw(el);
   el.querySelector('#ntp').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;tp=b.dataset.t;el.querySelectorAll('#ntp button').forEach(x=>x.className=x.dataset.t===tp?'on '+tp:'')};
   el.querySelector('#cl').onclick=async e=>{const b=e.target.closest('[data-cd]');if(!b)return;const id=b.dataset.cd;
     if(st.cats.filter(c=>c.type===cat(id).type).length<=1){toast('لازم تبقى فئة وحدة على الأقل');return}
     st.cats=st.cats.filter(c=>c.id!==id);delete st.catBudgets[id];draw(el);dirty.add('settings');saveLocal();scheduleCloud();toast('انحذفت الفئة، العمليات القديمة تبقى')};
   el.querySelector('#na').onclick=()=>{const n=el.querySelector('#nn').value.trim();if(!n){toast('اكتب اسم الفئة');return}
     st.cats.push({id:'c'+uid(),name:n,icon:el.querySelector('#ne').value.trim()||'🏷️',type:tp});el.querySelector('#nn').value='';draw(el);dirty.add('settings');saveLocal();scheduleCloud();toast('انضافت الفئة')};
   el.querySelector('#cs').onclick=()=>{el.querySelectorAll('[data-cn]').forEach(i=>{const c=st.cats.find(x=>x.id===i.dataset.cn);if(c&&i.value.trim())c.name=i.value.trim()});
     el.querySelectorAll('[data-ce]').forEach(i=>{const c=st.cats.find(x=>x.id===i.dataset.ce);if(c&&i.value.trim())c.icon=i.value.trim()});closeSheet();commit(['settings'])}})}

function recurringSheet(){const st=S.settings;
  const draw=el=>{el.querySelector('#rl').innerHTML=st.recurring.length?st.recurring.map(r=>{const c=cat(r.cat);return `<div class="tx"><span class="ico">${esc(c.icon)}</span><span class="main"><span class="t1">${esc(r.note||c.name)}</span><span class="t2">يوم ${plain(r.day)} من كل شهر · ${money(r.amount)}</span></span><button class="mini del" type="button" data-rd="${r.id}">إيقاف</button></div>`}).join(''):'<p class="muted small" style="margin:0">ماكو مصاريف ثابتة بعد. مثل الإيجار، المولدة، الإنترنت، القسط.</p>'};
  const cs=st.cats.filter(c=>c.type==='exp');
  openSheet(`${head('المصاريف الثابتة')}<p class="muted small" style="margin:0">تنضاف تلقائياً كل شهر بيومها، وتشوف القادمة منها بالرئيسية.</p><div class="card" style="padding:4px 16px"><div class="txs" id="rl"></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>إضافة مصروف ثابت</h2>
   <div class="field"><label for="ra">المبلغ</label><input id="ra" inputmode="decimal" placeholder="مثلاً 50000"></div>
   <div class="grid2"><div class="field"><label for="rc">الفئة</label><select id="rc">${cs.map(c=>`<option value="${esc(c.id)}">${esc(c.icon)} ${esc(c.name)}</option>`).join('')}</select></div>
   <div class="field"><label for="rd">يوم الدفع</label><select id="rd">${Array.from({length:28},(_,i)=>`<option value="${i+1}">${plain(i+1)}</option>`).join('')}</select></div></div>
   <div class="field"><label for="rn">الاسم</label><input id="rn" placeholder="مثلاً: اشتراك المولدة"></div>
   <button class="btn ghost" type="button" id="radd">إضافة</button></div>`,el=>{draw(el);
   el.querySelector('#rl').onclick=async e=>{const b=e.target.closest('[data-rd]');if(!b)return;st.recurring=st.recurring.filter(r=>r.id!==b.dataset.rd);draw(el);commit(['settings']);toast('توقف التكرار، المسجّل سابقاً يبقى')};
   el.querySelector('#radd').onclick=()=>{const a=parseAmount(el.querySelector('#ra').value);if(!a){toast('اكتب المبلغ');return}
     st.recurring.push({id:uid(),type:'exp',amount:a,cat:el.querySelector('#rc').value,day:+el.querySelector('#rd').value,note:el.querySelector('#rn').value.trim(),pay:st.pays[0],start:thisMonth()});
     el.querySelector('#ra').value='';el.querySelector('#rn').value='';const ch=applyRecurring(thisMonth());draw(el);commit(ch?['settings',thisMonth()]:['settings']);toast('انضاف ✓')}})}

function installSheet(){openSheet(`${head('تثبيته على الآيفون')}<ol class="steps">
  <li>افتح رابط البرنامج من <b>Safari</b>.</li><li>اضغط زر المشاركة (المربع اللي بيه سهم لفوك) بأسفل الشاشة.</li>
  <li>اختار <b>إضافة إلى الشاشة الرئيسية</b> (Add to Home Screen).</li><li>سمّيه «مصاريفي» واضغط إضافة. هسه يطلع كأيقونة مثل أي تطبيق.</li></ol>
  <p class="muted small" style="margin:0">نصيحة: سوِّ نسخة احتياطية كل شهر من الإعدادات وخليها بملفات الآيفون أو iCloud.</p><button class="btn" type="button" data-act="close">تمام</button><button class="btn ghost" type="button" data-act="hideInstall">ثبّتته، لا تذكّرني</button>`)}
function syncInfo(){if(syncState==='error'){setSync('saving');flush();return}
  const msg=syncState==='local'?'بياناتك محفوظة داخل الآيفون نفسه (بمكانين داخل التطبيق) وتشتغل بدون نت. تنحذف بس إذا حذفت أيقونة التطبيق أو مسحت بيانات Safari من الإعدادات، وهنا تفيدك النسخة الاحتياطية الشهرية.':'بياناتك محفوظة بحسابك بشكل خاص (محد يشوفها غيرك)، وتطلعلك من أي جهاز تفتح منه الرابط وأنت مسجّل دخول. وبعد تنحفظ نسخة على الجهاز.';
  openSheet(`${head('وين تنحفظ بياناتي؟')}<p style="margin:0">${msg}</p><button class="btn" type="button" data-act="close">تمام</button>`)}

/* ---------- export / import ---------- */
async function shareFile(name,text,mime){
  try{const f=new File([text],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'ok'}}
  catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  return null}
async function backup(){const name='masareef-backup-'+todayStr()+'.json',text=backupText();
  let r=await shareFile(name,text,'application/json');if(r==='cancel')return;
  if(!r)await saveFile(name,text,'application/json');
  S.settings.lastBackup=Date.now();commit(['settings']);toast('تم ✓ خلي الملف بتطبيق الملفات أو iCloud')}
function snapsSheet(){
  openSheet(`${head('النسخ التلقائية')}<p class="muted small" style="margin:0">البرنامج يحفظ نسخة داخلية بأول فتحة بكل شهر (آخر 3 أشهر). تفيدك إذا مسحت شي بالغلط، بس ما تغني عن النسخة اللي تحفظها بالملفات.</p>
  <div class="card" style="padding:4px 16px"><div class="txs">${snaps.length?snaps.map((x,i)=>`<div class="tx"><span class="ico">🗂️</span><span class="main"><span class="t1">${esc(monthName(x.month))}</span><span class="t2">${esc(new Date(x.at).toLocaleString('ar-IQ'))}</span></span><button class="mini" type="button" data-snap="${i}">استرجاع</button></div>`).join(''):'<p class="muted small">ماكو نسخ بعد.</p>'}</div></div>`,
  el=>{el.onclick=e=>{const b=e.target.closest('[data-snap]');if(b){closeSheet();setTimeout(()=>restoreFrom(snaps[+b.dataset.snap].data),320)}}})}
async function saveFile(name,text,mime){
  try{if(window.claude&&typeof window.claude.use==='function'){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:text});toast('تم الحفظ');return}}}
  catch(e){toast('ما تم الحفظ');return}
  try{const blob=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  catch(e){toast('المتصفح ما سمح بالتنزيل، استخدم «نسخ للحافظة»')}}
function csv(){const rows=[['التاريخ','النوع','الفئة','المبلغ','طريقة الدفع','ملاحظة']];
  [...txs(cur)].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,t.type==='inc'?'دخل':'مصروف',cat(t.cat).name,t.amount,t.pay||'',t.note||'']));
  const s=sums(cur);rows.push([]);rows.push(['','مجموع المصاريف','',s.exp]);rows.push(['','مجموع الدخل','',s.inc]);
  const text='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  shareFile('masareef-'+cur+'.csv',text,'text/csv').then(r=>{if(!r)saveFile('masareef-'+cur+'.csv',text,'text/csv')})}
const backupText=()=>JSON.stringify({app:'masareef',v:1,at:new Date().toISOString(),data:S});
async function restoreFrom(text){let v;try{v=JSON.parse(text);v=v.data||v;if(!v.settings||!v.months)throw 0}catch(e){toast('الملف مو نسخة احتياطية صحيحة');return}
  const ok=await ask('الاسترجاع راح يبدّل كل بياناتك الحالية ببيانات النسخة. تكمل؟','استرجع',true);if(!ok)return;
  S={settings:Object.assign(defaultSettings(),v.settings),months:v.months};applyTheme();dirty.add('settings');Object.keys(S.months).forEach(k=>dirty.add(k));commit();toast('تم الاسترجاع ✓')}

async function wipe(){const ok=await ask('راح تنمسح كل العمليات والإعدادات نهائياً. سوّيت نسخة احتياطية؟','امسح الكل',true);if(!ok)return;
  const keys=Object.keys(S.months);S={settings:defaultSettings(),months:{}};applyTheme();saveLocal();dirty.clear();
  if(col){setSync('saving');try{for(const k of keys)await col.doc('m-'+k).delete();await col.doc('settings').delete();setSync('cloud')}catch(e){setSync('error')}}
  render();toast('انمسحت البيانات')}

/* ---------- demo ---------- */
function demo(){let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const now=thisMonth(),td=new Date().getDate();const keys=[];
  const plan=[['food',8,[8000,35000]],['rest',6,[6000,30000]],['fuel',6,[10000,25000]],['net',1,[30000,30000]],['gen',1,[60000,60000]],['health',1,[15000,40000]],['clothes',1,[25000,70000]],['fun',3,[10000,30000]],['bills',1,[12000,12000]]];
  const notes={food:['خضرة وفواكه','سوق الأسبوع','خبز وصمون'],rest:['غدا','قهوة','عشا ويا الأهل'],fuel:['بنزين','تكسي'],net:['اشتراك الشهر'],gen:['أمبيرات المولدة'],health:['صيدلية'],clothes:['قميص'],fun:['طلعة'],bills:['ماء']};
  for(let m=-2;m<=0;m++){const k=shiftMonth(now,m);const lim=m===0?td:daysIn(k);const arr=S.months[k]||(S.months[k]=[]);
    arr.push({id:uid(),type:'inc',amount:1250000,cat:'salary',note:'راتب الشهر',pay:'بطاقة',date:k+'-01',demo:true});
    for(const [c,n,[a,b]] of plan){const cnt=Math.max(1,Math.round(n*lim/daysIn(k)));for(let i=0;i<cnt;i++){const d=1+Math.floor(rnd()*lim);const amt=Math.round((a+rnd()*(b-a))/250)*250;
      arr.push({id:uid(),type:'exp',amount:amt,cat:c,note:notes[c][Math.floor(rnd()*notes[c].length)],pay:rnd()>.6?'بطاقة':'نقد',date:k+'-'+pad(d),demo:true})}}
    keys.push(k)}
  if(!S.settings.budget){S.settings.budget=1000000;S.settings.demoBudget=true}
  S.settings.demo=true;keys.push('settings');commit(keys);toast('انضافت بيانات تجريبية')}
function clearDemo(){const keys=['settings'];for(const k in S.months){const b=S.months[k].length;S.months[k]=S.months[k].filter(t=>!t.demo);if(S.months[k].length!==b)keys.push(k)}
  if(S.settings.demoBudget){S.settings.budget=0;delete S.settings.demoBudget}S.settings.demo=false;commit(keys);toast('انمسحت البيانات التجريبية')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const ft=e.target.closest('[data-f-type]');if(ft){F.type=ft.dataset.fType;renderList();return}
  const fc=e.target.closest('[data-f-cat]');if(fc){F.cat=fc.dataset.fCat;renderList();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  switch(act){
    case 'add':txSheet(null);break;
    case 'edit':{const t=txs(a.dataset.m).find(x=>x.id===a.dataset.id);if(t)txSheet(t);break}
    case 'close':closeSheet();break;
    case 'prevM':cur=shiftMonth(cur,-1);if(applyRecurring(cur))commit();else render();break;
    case 'nextM':cur=shiftMonth(cur,1);if(applyRecurring(cur))commit();else render();break;
    case 'thisM':cur=thisMonth();render();break;
    case 'budget':budgetSheet();break;
    case 'catBudgets':catBudgetsSheet();break;
    case 'cats':catsSheet();break;
    case 'recurring':recurringSheet();break;
    case 'install':installSheet();break;
    case 'syncInfo':syncInfo();break;
    case 'csv':csv();break;
    case 'backup':backup();break;
    case 'snaps':snapsSheet();break;
    case 'hideInstall':S.settings.installDismissed=true;closeSheet();commit(['settings']);break;
    case 'copyBackup':navigator.clipboard.writeText(backupText()).then(()=>toast('انسخت، الصقها بالملاحظات للحفظ'),()=>toast('ما گدرت أنسخ'));break;
    case 'restore':$('#fileIn').click();break;
    case 'wipe':wipe();break;
    case 'demo':demo();break;
    case 'clearDemo':clearDemo();break;
  }
});
$('#backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;renderList()}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.set;if(!k)return;S.settings[k]=e.target.value;if(k==='theme')applyTheme();commit(['settings'])});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(f);e.target.value=''});


/* ---------- start ---------- */
cur=thisMonth();loadLocal();applyTheme();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
initDevice();
if(applyAllRecurring())saveLocal();
render();
initCloud();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(applyAllRecurring())commit();else render()}});
</script>
</body>
